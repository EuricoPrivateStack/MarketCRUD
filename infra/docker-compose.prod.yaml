services:

  api:
    container_name: marketcrud-api
    image: eurico149/marketcrud-api:latest
    restart: unless-stopped
    environment:
      MONGO_URI: ${MARKETCRUD_MONGO_URI}
      JWT_REFRESH_SECRET: ${MARKETCRUD_JWT_REFRESH_SECRET}
      JWT_ACCESS_SECRET: ${MARKETCRUD_JWT_ACCESS_SECRET}
      URL_FRONTEND: ${MARKETCRUD_URL_FRONTEND}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    container_name: marketcrud-front
    image: eurico149/marketcrud-front:latest
    restart: unless-stopped

  nginx:
    container_name: marketcrud-nginx
    image: nginx:stable
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - cloudflare-tunnel
    depends_on:
      - front
      - api

  mongo:
    container_name: marketcrud-mongo
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MARKETCRUD_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MARKETCRUD_MONGO_PASSWORD}
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "127.0.0.1/test" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db

  redis:
    container_name: marketcrud-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:

networks:
  cloudflare-tunnel:
    external: true
