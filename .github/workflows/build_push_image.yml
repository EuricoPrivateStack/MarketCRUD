name: Build & Push Images

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            eurico149/marketcrud-api:latest
            eurico149/marketcrud-api:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Push Front
        uses: docker/build-push-action@v5
        with:
          context: ./front
          push: true
          tags: |
            eurico149/marketcrud-front:latest
            eurico149/marketcrud-front:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
